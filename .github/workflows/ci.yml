name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"

jobs:
  gates:
    name: Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # contract-diff compares against the merge base

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Custom gates
        run: |
          bash tools/gates/no-naive-casing.sh
          bash tools/gates/no-float-money.sh
          bash tools/gates/no-naive-datetime.sh
          python tools/gates/updated-at-triggers.py

      - uses: pre-commit/action@v3.0.1

api:
    name: API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install
        run: uv sync --all-extras

      - name: Types
        run: cd apps/api && MYPYPATH=src uv run mypy --strict src/bazaarwatch

      - name: Module boundaries
        run: cd apps/api && PYTHONPATH=src uv run lint-imports --config pyproject.toml

      - name: Tests
        run: uv run pytest
