name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

# Every step runs a `make` target rather than an inlined command, so CI and a
# laptop run the same thing. An inlined command drifts from the Makefile the
# first time either is edited, and the drift is invisible until CI passes
# something that fails locally, or the reverse.
jobs:
  gates:
    name: Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0   # contract-diff compares against the merge base

      # uv is required before pre-commit, not after: four hooks are `language:
      # system` and shell out to `uv run`, deliberately, so that the hook and
      # `make lint` use one pinned ruff. Without uv on PATH they fail with
      # "command not found".
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install
        run: uv sync --all-groups

      - name: Cache hook environments
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Custom gates
        run: make gates

      # `make hooks-run`, not `pre-commit/action`. The action installs
      # pre-commit with `python -m pip install`, and after `uv sync` the python
      # on PATH is the project venv, which uv builds without pip. It cannot
      # work here.
      #
      # It would also be the wrong tool if it did work. The action installs an
      # unpinned pre-commit outside the lockfile, which is the same two-versions
      # problem the `language: system` hooks exist to avoid.
      - name: Hooks
        run: make hooks-run

  api:
    name: API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # --all-groups, not --all-extras. The toolchain lives in
      # [dependency-groups], and extras are a different mechanism: mypy, pytest
      # and import-linter are not extras of anything.
      - name: Install
        run: uv sync --all-groups

      - name: Types
        run: make typecheck

      - name: Module boundaries
        run: make boundaries

      - name: Tests
        run: make test

  integration:
    name: Integration
    runs-on: ubuntu-latest
    # One set of credentials for compose and for the tests. Splitting them is
    # how a password ends up written twice and disagreeing with itself.
    env:
      POSTGRES_PASSWORD: ci-not-a-secret
      DATABASE_URL: postgresql+psycopg://bazaarwatch:ci-not-a-secret@localhost:55432/bazaarwatch
      # `migrations/env.py` loads the whole Settings object, so a migration
      # cannot run without a Redis URL it never uses. There is no `.env` on a
      # runner, so every required setting has to be here.
      REDIS_URL: redis://localhost:56379/0
      # Turns the skip into a failure. This is the job whose only purpose is to
      # run these, so silence is the one outcome that must not look like success.
      REQUIRE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install
        run: uv sync --all-groups

      # docker compose rather than a `services:` block, so CI and a laptop
      # bring up the same custom image. A service block would need the image
      # defined twice, and the second definition is the one that drifts.
      - name: Start the stack
        run: make up

      # These fail rather than skip here. A skipped integration suite in CI is
      # indistinguishable from a passing one, which is how the fold parity check
      # stayed unrun for four slices.
      - name: Integration tests
        run: make test-integration

      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
