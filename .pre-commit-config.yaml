# Gates run locally as well as in CI. Catching a naive-casing mistake at commit
# time is the difference between a habit and an annoyance.
#
#   make hooks     install
#   make check     run everything against all files
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: trailing-whitespace
      - id: detect-private-key

  # Deliberately the workspace ruff, not ruff-pre-commit. A separately pinned
  # ruff means two versions in one repository, and they will disagree: a rule
  # or a per-file-ignore glob that one honours the other may not. One ruff,
  # from the lockfile, is the only arrangement where `make lint` and the hook
  # can be trusted to agree.
  - repo: local
    hooks:
      - id: ruff
        name: ruff (workspace)
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff-format (workspace)
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true

  - repo: local
    hooks:
      - id: no-naive-casing
        name: no locale-naive case conversion (ADR-0025)
        entry: tools/gates/no-naive-casing.sh
        language: script
        types_or: [python, ts, tsx]

      - id: no-float-money
        name: no float arithmetic on money (ADR-0004)
        entry: tools/gates/no-float-money.sh
        language: script
        types_or: [python, ts, tsx]

      - id: no-naive-datetime
        name: no naive datetime construction
        entry: tools/gates/no-naive-datetime.sh
        language: script
        types: [python]

      - id: updated-at-triggers
        name: every updated_at column has a trigger
        entry: tools/gates/updated-at-triggers.py
        language: script
        pass_filenames: false
        files: ^apps/api/src/bazaarwatch/migrations/
