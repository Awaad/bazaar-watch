# Hooks verify. They do not modify.
#
# An auto-fixing hook rewrites staged files, and when the same file also has
# unstaged changes, pre-commit's stash cannot be restored cleanly and the commit
# rolls back. That loop costs more than the convenience is worth, so every hook
# here either passes or fails with something actionable.
#
#   make fmt       fix everything
#   make check     verify, and never modify
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-json
      - id: check-toml
      - id: check-yaml
      # Python is excluded from both: ruff-format already strips trailing
      # whitespace, including inside docstrings, and guarantees a final
      # newline. Running them over .py as well means two hooks competing to
      # rewrite the same lines.
      - id: end-of-file-fixer
        exclude_types: [python, pyi]
      - id: mixed-line-ending
        args: ["--fix=lf"]
        exclude_types: [python, pyi]
      - id: trailing-whitespace
        exclude_types: [python, pyi]
      - id: detect-private-key

  # Deliberately the workspace ruff, not ruff-pre-commit. A separately pinned
  # ruff means two versions in one repository, and they will disagree: a rule
  # or a per-file-ignore glob that one honours the other may not. One ruff,
  # from the lockfile, is the only arrangement where `make lint` and the hook
  # can be trusted to agree.
  - repo: local
    hooks:
      - id: ruff
        name: ruff (workspace)
        entry: uv run ruff check
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff-format (workspace)
        entry: uv run ruff format --check
        language: system
        types_or: [python, pyi]
        require_serial: true

  - repo: local
    hooks:
      - id: no-naive-casing
        name: no locale-naive case conversion (ADR-0025)
        entry: tools/gates/no-naive-casing.sh
        language: script
        types_or: [python, ts, tsx]

      - id: no-float-money
        name: no float arithmetic on money (ADR-0004)
        entry: tools/gates/no-float-money.sh
        language: script
        types_or: [python, ts, tsx]

      - id: no-naive-datetime
        name: no naive datetime construction
        entry: tools/gates/no-naive-datetime.sh
        language: script
        types: [python]

      - id: updated-at-triggers
        name: every updated_at column has a trigger
        entry: tools/gates/updated-at-triggers.py
        language: script
        pass_filenames: false
        files: ^apps/api/src/bazaarwatch/migrations/

      # `language: system` and `uv run`, unlike the hook above, because this
      # one imports PyYAML. A `language: script` shebang would run whichever
      # python3 is on PATH, which is not the environment holding the lockfile.
      - id: workflow-jobs
        name: workflow jobs are declared under `jobs`
        entry: uv run python tools/gates/workflow-jobs.py
        language: system
        pass_filenames: false
        files: ^\.github/workflows/

      - id: enum-parity
        name: enum-backed CHECK constraints exist in the migrations
        entry: uv run python tools/gates/enum-parity.py
        language: system
        pass_filenames: false
        files: ^apps/api/src/bazaarwatch/(modules|migrations)/
