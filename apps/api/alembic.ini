# Alembic owns all DDL. No table is created by application code and no column
# is added by hand. See docs/13-infra-devops.md.
#
# The database URL is not here. It comes from settings, so one source of truth
# serves the application and the migrations, and a credential never sits in a
# committed file.

[alembic]
script_location = src/bazaarwatch/migrations
prepend_sys_path = src
path_separator = os
# Sortable, so `ls versions/` shows the real order.
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %%(levelname)-5.5s [%%(name)s] %%(message)s
datefmt = %%H:%%M:%%S
