# Alembic owns all DDL. No table is created by application code and no column
# is added by hand. See docs/13-infra-devops.md.
#
# The database URL is not here. It comes from settings, so one source of truth
# serves the application and the migrations, and a credential never sits in a
# committed file.

[alembic]
script_location = %(here)s/src/bazaarwatch/migrations
prepend_sys_path = %(here)s/src
path_separator = os
# Sortable, so `ls versions/` shows the real order.
file_template = %%(rev)s_%%(slug)s
timezone = UTC
