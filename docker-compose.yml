# Local development stack.
#
# Ports are deliberately non-default so nothing collides with a local Postgres
# or Redis install. See the port table in README.md.
#
# Application services arrive with the code they run. This file currently
# provides only the two backing services.

name: bazaar-watch

services:
  postgres:
    build:
      context: ./infra/docker/postgres
    image: bazaar-watch/postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bazaarwatch}
      POSTGRES_USER: ${POSTGRES_USER:-bazaarwatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required, see .env.example}
      # Deterministic collation. Locale-dependent ordering would make index
      # behaviour differ between machines, and Turkish collation is a live
      # concern here (ADR-0025).
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bazaarwatch} -d ${POSTGRES_DB:-bazaarwatch}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    command:
      - postgres
      # Development only. Surfaces slow queries early, which matters for the
      # geo and vector paths that carry real cost.
      - -c
      - log_min_duration_statement=250ms
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - max_connections=100

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-56379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    command:
      - redis-server
      # Persistence on. Redis holds the job queue and idempotency replay
      # records; losing them on restart would mean losing queued extraction
      # work and re-processing submissions clients believe are accepted.
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      # Eviction above zero is an alert condition: it means rate limits and
      # idempotency keys are being silently dropped. Fail loudly instead.
      - --maxmemory-policy
      - noeviction

volumes:
  postgres-data:
  redis-data:
