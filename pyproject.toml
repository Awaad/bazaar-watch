# Root configuration. Shared tool settings for every Python workspace member.

[tool.uv.workspace]
members = ["apps/api"]

# Dev tooling is pinned in the workspace and invoked through `uv run`, never
# assumed on PATH. A globally installed ruff is unpinned, differs between
# machines, and is exactly the kind of thing that makes CI and a laptop
# disagree.
[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "import-linter>=2.1",
    "pre-commit>=4.0",
    # tools/gates/workflow-jobs.py. Present transitively via pre-commit
    # already, which is not a dependency anyone should rely on.
    "pyyaml>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
# Gate fixtures are inputs, not source. Several of them contain the exact
# mistake the gate exists to catch, so linting them would mean fixing the thing
# under test.
#
# `force-exclude` is the point: without it an exclusion applies when ruff walks
# the tree and not when a path is named explicitly, which is how pre-commit
# invokes it, and `make lint` and the hook then disagree.
extend-exclude = ["tools/gates/fixtures"]
force-exclude = true
# Migrations are not excluded. They are hand-written here, they are the most
# consequential code in the repository, and an exclusion that applies to
# directory traversal but not to explicitly named paths makes `make lint`
# and the pre-commit hook disagree.

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "C4",        # comprehensions
    "DTZ",       # naive datetime: every timestamp in this system is tz-aware
    "T20",       # print statements
    "PT",        # pytest style
    "RET",       # return simplification
    "SIM",       # simplification
    "TID",       # tidy imports
    "ARG",       # unused arguments
    "PTH",       # pathlib over os.path
    "ERA",       # commented-out code
    "PL",        # pylint subset
    "RUF",
]
ignore = [
    "PLR0913",   # argument count: FastAPI dependencies legitimately exceed it
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["PLR2004"]   # magic values are the point of a test assertion
# Ambiguous Unicode is the subject matter of the fold, not a mistake in it.
"**/core/text.py" = ["RUF001", "RUF002"]
"**/tests/test_text.py" = ["PLR2004", "RUF001", "RUF002"]
"**/tests/test_fold_parity.py" = ["PLR2004", "RUF001", "RUF002"]
"**/tests/test_slugify.py" = ["PLR2004", "RUF001", "RUF002"]
# Turkish text is the subject, not an accident.
"**/tests/test_geo_constraints.py" = ["PLR2004", "RUF001", "RUF002"]
# Real receipt text from a Girne chain, quoted verbatim.
"**/tests/test_observations.py" = ["PLR2004", "RUF001", "RUF002"]
# Gates and the seed are command-line tools. Printing is their output, and
# the seed is full of Turkish product and place names on purpose.
"tools/gates/*.py" = ["T201"]
"tools/seed/*.py" = ["T201", "RUF001", "RUF002"]

[tool.ruff.lint.isort]
known-first-party = ["bazaarwatch"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
warn_no_return = true
disallow_any_generics = true
no_implicit_reexport = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "strict"
pythonpath = ["apps/api/src"]
testpaths = ["apps"]
markers = [
    "integration: requires Postgres and Redis (docker compose up -d)",
    "privacy: adversarial tests for the service-layer privacy invariants (never skip)",
]
